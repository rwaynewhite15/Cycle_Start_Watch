; Cycle Start Watch - phase 1 firmware
;
; Two hardware targets share one code base. Pick one with `pio run -e <env>`.
;   esp32c3  - ESP32-C3-DevKitM-1 (cheapest, single core, BLE 5)
;   esp32s3  - ESP32-S3-DevKitC-1 (dual core, more RAM, also BLE 5)
; `native` runs the pure-logic unit tests on your PC: `pio test -e native`.

[platformio]
default_envs = esp32c3

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17, pinned so builds are repeatable
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
    h2zero/NimBLE-Arduino@2.1.2
    adafruit/RTClib@2.1.4
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -D CSW_FW_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=1
test_ignore = *                       ; on-target tests not used yet; see env:native

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ; The DevKitM-1 has a USB-serial chip, so Serial goes out on UART0.
    ; Clone boards without one (e.g. "C3 SuperMini") need these two instead:
    ; -D ARDUINO_USB_MODE=1
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CSW_PIN_LAMP=4
    -D CSW_PIN_SDA=5
    -D CSW_PIN_SCL=6
    -D CSW_PIN_BUTTON=9               ; BOOT button on the dev kit
    -D CSW_PIN_RGB=8                  ; on-board WS2812 LED

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D CSW_PIN_LAMP=4
    -D CSW_PIN_SDA=8
    -D CSW_PIN_SCL=9
    -D CSW_PIN_BUTTON=0               ; BOOT button on the dev kit
    -D CSW_PIN_RGB=48                 ; on-board WS2812 (GPIO38 on some board revisions)

[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=c++17 -I src
; Only the hardware-independent logic is compiled for the PC.
build_src_filter = -<*> +<lamp_filter.cpp>
test_ignore =
test_build_src = yes
