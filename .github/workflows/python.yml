name: python

on:
  push:
    paths: ["tools/**", "gateway/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["tools/**", "gateway/**", ".github/workflows/python.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Raspberry Pi OS Bookworm ships 3.11
      - name: Protocol decoder tests
        working-directory: tools
        run: python -m unittest -v test_csw_protocol
      - name: Gateway tests
        working-directory: gateway
        run: python -m unittest -v test_gateway
