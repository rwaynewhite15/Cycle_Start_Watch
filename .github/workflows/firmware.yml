name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Unit tests (PC)
        run: pio test -e native
      - name: Build ESP32-C3
        run: pio run -e esp32c3
      - name: Build ESP32-S3
        run: pio run -e esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/.pio/build/*/firmware.bin
